name: ShopSphere CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Multi-Database Init for PostgreSQL
        run: |
          chmod +x infrastructure/docker/postgres/init-multiple-dbs.sh
          POSTGRES_USER=postgres PGPASSWORD=postgrespassword ./infrastructure/docker/postgres/init-multiple-dbs.sh

      - name: Build Modules & Execute Unit Tests
        run: |
          chmod +x mvnw
          ./mvnw clean test --batch-mode

      - name: Run Testcontainers E2E Saga Integration Test
        run: |
          ./mvnw test -pl order-service -Dtest=OrderWorkflowIntegrationTest --batch-mode

      - name: Package Service JARs
        run: |
          ./mvnw clean package -DskipTests --batch-mode

      - name: Verify Docker Compose Build
        run: |
          docker compose build --parallel
