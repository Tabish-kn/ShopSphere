services:
  # ========================================================
  # 1. PostgreSQL (Multi-Schema Storage for all Microservices)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: "user_db,product_db,inventory_db,order_db,payment_db,notification_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================================
  # 2. Redis (Shopping Cart State & Rate Limiting)
  # ========================================================
  redis:
    image: redis:7.2-alpine
    container_name: shopsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================================
  # 3. Apache Kafka (KRaft Mode - No Zookeeper Dependency)
  # ========================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shopsphere-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================================
  # 4. Kafka UI (Topic & Consumer Group Monitoring)
  # ========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: shopsphere-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsphere-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shopsphere-network

  # ========================================================
  # 5. Zipkin (Distributed Tracing)
  # ========================================================
  zipkin:
    image: openzipkin/zipkin:3.3
    container_name: shopsphere-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - shopsphere-network

  # ========================================================
  # 6. Prometheus (Metrics Scraper & Time-Series DB)
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopsphere-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - shopsphere-network

  # ========================================================
  # 7. Grafana (Observability Dashboards & Alerts)
  # ========================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: shopsphere-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shopsphere-network

  # ========================================================
  # 8. Spring Cloud Config Server
  # ========================================================
  config-server:
    build:
      context: ./config-server
    container_name: shopsphere-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
    networks:
      - shopsphere-network

  # ========================================================
  # 9. Netflix Eureka Discovery Server
  # ========================================================
  discovery-server:
    build:
      context: ./discovery-server
    container_name: shopsphere-discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - shopsphere-network

  # ========================================================
  # 10. Spring Cloud API Gateway
  # ========================================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: shopsphere-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      REDIS_HOST: redis
    depends_on:
      - discovery-server
      - redis
    networks:
      - shopsphere-network

  # ========================================================
  # 11. User Service
  # ========================================================
  user-service:
    build:
      context: ./user-service
    container_name: shopsphere-user-service
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 12. Product Service
  # ========================================================
  product-service:
    build:
      context: ./product-service
    container_name: shopsphere-product-service
    ports:
      - "8082:8082"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 13. Inventory Service
  # ========================================================
  inventory-service:
    build:
      context: ./inventory-service
    container_name: shopsphere-inventory-service
    ports:
      - "8083:8083"
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 14. Cart Service
  # ========================================================
  cart-service:
    build:
      context: ./cart-service
    container_name: shopsphere-cart-service
    ports:
      - "8084:8084"
    environment:
      REDIS_HOST: redis
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 15. Order Service
  # ========================================================
  order-service:
    build:
      context: ./order-service
    container_name: shopsphere-order-service
    ports:
      - "8085:8085"
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 16. Payment Service
  # ========================================================
  payment-service:
    build:
      context: ./payment-service
    container_name: shopsphere-payment-service
    ports:
      - "8086:8086"
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

  # ========================================================
  # 17. Notification Service
  # ========================================================
  notification-service:
    build:
      context: ./notification-service
    container_name: shopsphere-notification-service
    ports:
      - "8087:8087"
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks:
      - shopsphere-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  shopsphere-network:
    driver: bridge
